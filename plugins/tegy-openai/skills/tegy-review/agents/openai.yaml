interface:
  display_name: "Tegy Review"
  short_description: "Tegy Review for supplied business material"
  default_prompt: "Use Tegy to independently review the strategy and original brief I supply."

dependencies:
  tools:
    - type: "mcp"
      value: "tegy-mcp"
      description: "Tegy's hosted Review, Solve and Executive Summary"
      transport: "streamable_http"
